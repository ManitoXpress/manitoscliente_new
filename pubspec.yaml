name: manitoscliente_new
description: "Projecto ManitosXpress."
publish_to: 'none'

version: 1.5.2+1

environment:
  sdk: '>=3.2.6 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera_avfoundation: ^0.9.16
  sign_in_with_apple: ^6.1.1
  persistent_bottom_nav_bar: any
  cupertino_icons: ^1.0.2
  cloud_firestore: ^5.0.1
  firebase_analytics: ^11.3.1
  firebase_core: ^3.1.0
  google_sign_in: ^6.1.5
  google_fonts: ^6.2.1
  app_tracking_transparency: ^2.0.5
  flutter_screenutil: ^5.9.3
  flutter_local_notifications: ^17.2.2
  firebase_app_check: ^0.3.1+6

  flutter_cupertino_date_picker_fork: ^1.0.7
  blobs: ^2.0.0
  flutter_blob: ^0.0.1
  device_info_plus: ^10.1.2

  
  firebase_messaging: ^15.0.1
  firebase_auth: ^5.1.0
  flutter_launcher_icons: ^0.13.1
  google_maps_flutter: ^2.5.0
  url_launcher: ^6.0.9
  font_awesome_flutter: ^10.7.0
  flare_flutter: ^3.0.2
  circular_bottom_navigation: ^2.3.0
  neumorphic_button: ^0.0.1+2
  native_context_menu: ^0.2.2+5
  searchbar_animation: ^0.0.4
  fluttertoast: ^8.0.7
  rive: ^0.13.7
  floating_chat_button: ^1.0.1
  flutter_animate: ^4.2.0
  timeline_tile: ^2.0.0
  image_picker: ^1.0.4
  flutter_sequence_animation: ^4.0.0
  any_animated_button: ^0.0.4
  timelines: ^0.1.0
  scrollable_positioned_list: ^0.3.8
  draggable_scrollbar: ^0.1.0
  anim_search_bar: ^2.0.3
  flutter_svg: ^2.0.7
  http: ^1.1.0
  http_parser: ^4.0.2
  geocoding: ^3.0.0
  intl: ^0.19.0
  firebase_storage: ^12.3.6
  uuid: ^4.1.0

  flutter_rating_bar: ^4.0.1
  flutter_wizard: ^2.0.5
  geolocator: ^12.0.0
  camera: ^0.11.0+1
  torch_light: ^1.0.0
  photo_view: ^0.15.0
  overlay_support: ^2.1.0
  flutter_typeahead: ^5.2.0
  file_picker: ^8.0.4
  path: ^1.8.3
  permission_handler: ^11.3.1
  location: ^6.0.2
  shared_preferences: ^2.2.2
  flutter_ticket: ^1.0.1
  flutter_secure_storage: ^9.2.2
  jwt_decode: ^0.3.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/LOGO1_COLOR.png
    - assets/images/LOGO2_BLANCO.png
    - assets/images/LOGO1_NEGRO.png
    - assets/images/LOGO2_NEGRO.png
    - assets/images/LOGO2_COLOR.png
    - assets/images/LOGO1_Blanco.png
    - assets/images/xpress.png
    - assets/animations/login.riv
    - assets/images/zapatero.png
    - assets/images/taxi.png
    - assets/images/pexels.gif
    - assets/images/mundo.png
    - assets/animations/manito.png
    - assets/map.jpeg

  fonts:
    - family: Xpress Heavy
      fonts:
        - asset: assets/fonts/Xpress_HeavyItalic.otf
        - asset: assets/fonts/Xpress_Regular.otf